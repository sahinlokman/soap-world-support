<script>window.PAGE_TRANSLATIONS={"tr": {"tagline": "Gizlilik Politikası", "title": "Gizlilik Politikası", "updated": "Son güncelleme: 19 Eylül 2026", "local": "Soap World hesap gerektirmez. Oyun ilerlemesi, ayarlar, skorlar, koleksiyon ve dil tercihi cihazınızda yerel olarak saklanır. Bu veriler tarafımızca bir sunucuya gönderilmez.", "adsTitle": "Reklamlar ve Google AdMob", "ads": "Uygulama reklam göstermek için Google AdMob kullanır. Google ve reklam ortakları; reklam sunma, ölçme, güvenlik ve iyileştirme amaçlarıyla IP adresinden türetilen yaklaşık konum, cihaz tanımlayıcıları, reklam verileri, ürün etkileşimleri, tanılama ve performans bilgilerini işleyebilir.", "choicesTitle": "Seçimleriniz", "choices": "Gerekli bölgelerde reklam talep edilmeden önce izin seçenekleri sunulur. Uygun olduğunda Ayarlar → Gizlilik seçenekleri bölümünden tercihlerinizi tekrar açabilirsiniz. iOS takip izni Sistem Ayarlarından da yönetilebilir.", "childrenTitle": "Hesaplar ve içerik", "children": "Uygulamada giriş hesabı, kullanıcılar arası mesajlaşma veya kullanıcı tarafından oluşturulan içerik bulunmaz.", "contactTitle": "İletişim", "contact": "Gizlilik veya destek talepleri için destek sayfamızdaki GitHub Issues bağlantısını kullanın.", "support": "Destek", "google": "Google Gizlilik Politikası", "purchasesTitle": "Satın almalar ve RevenueCat", "purchases": "İsteğe bağlı tek seferlik reklam kaldırma ödemesini Apple işler. RevenueCat, reklamsız erişimi doğrulamak ve geri yüklemek için anonim uygulama kullanıcı kimliğini ve satın alma geçmişini işler. Ödeme kartı bilgilerinizi almayız. Bu kayıtlar satın alma ve gelir analizi için de kullanılır.", "retentionTitle": "Saklama ve silme", "retention": "Oyun ilerlemesi, uygulamayı ve verilerini silene kadar cihazınızda kalır. Apple ve RevenueCat, doğrulama, geri yükleme ve geçerli saklama yükümlülükleri için satın alma kayıtlarını tutar. Saklama ve silme uygulamaları kendi gizlilik politikalarında açıklanır. Veri talepleri için destek sayfamızı kullanın; herkese açık taleplerde makbuz veya kişisel bilgi paylaşmayın."}, "en": {"tagline": "Privacy Policy", "title": "Privacy Policy", "updated": "Last updated: September 19, 2026", "local": "Soap World does not require an account. Game progress, settings, scores, collection, and language preference are stored locally on your device. We do not send this data to our server.", "adsTitle": "Advertising and Google AdMob", "ads": "The app uses Google AdMob to display advertising. Google and its advertising partners may process IP-address-derived approximate location, device identifiers, advertising data, product interactions, diagnostics, and performance information to deliver, measure, secure, and improve advertising.", "choicesTitle": "Your choices", "choices": "Where required, consent choices are presented before ads are requested. When available, you can revisit them in Settings → Privacy options. iOS tracking permission can also be managed in System Settings.", "childrenTitle": "Accounts and content", "children": "The app has no sign-in account, user-to-user messaging or user-generated content.", "contactTitle": "Contact", "contact": "For privacy or support requests, use the GitHub Issues link on our support page.", "support": "Support", "google": "Google Privacy Policy", "purchasesTitle": "Purchases and RevenueCat", "purchases": "Apple processes the optional one-time ad-removal payment. RevenueCat processes an anonymous app user identifier and purchase history to verify and restore ad-free access. We do not receive your payment card details. These records are also used for purchase and revenue analytics.", "retentionTitle": "Retention and deletion", "retention": "Game progress remains on your device until you remove the app and its data. Purchase records are retained by Apple and RevenueCat for verification, restoration and their applicable retention requirements. Their privacy policies describe their retention and deletion practices. Use our support page for data requests; do not post receipts or personal information in public issues."}, "de": {"tagline": "Datenschutzerklärung", "title": "Datenschutzerklärung", "updated": "Letzte Aktualisierung: 19. September 2026", "local": "Soap World benötigt kein Konto. Fortschritt, Einstellungen, Punktestände, Sammlung und Sprache werden lokal auf deinem Gerät gespeichert und nicht an unseren Server gesendet.", "adsTitle": "Werbung und Google AdMob", "ads": "Die App verwendet Google AdMob. Google und Werbepartner können ungefähren Standort aus der IP-Adresse, Gerätekennungen, Werbedaten, Produktinteraktionen, Diagnose- und Leistungsdaten zur Bereitstellung, Messung, Sicherheit und Verbesserung von Werbung verarbeiten.", "choicesTitle": "Deine Auswahl", "choices": "Wo erforderlich, werden Einwilligungsoptionen vor der Werbeanfrage angezeigt. Du kannst sie gegebenenfalls unter Einstellungen → Datenschutzoptionen erneut aufrufen. Die iOS-Tracking-Erlaubnis lässt sich in den Systemeinstellungen verwalten.", "childrenTitle": "Konten und Inhalte", "children": "Die App hat keine Anmeldekonten, Nachrichten zwischen Nutzern oder nutzergenerierten Inhalte.", "contactTitle": "Kontakt", "contact": "Nutze für Datenschutz- oder Supportanfragen den GitHub-Issues-Link auf unserer Supportseite.", "support": "Support", "google": "Google-Datenschutzerklärung", "purchasesTitle": "Käufe und RevenueCat", "purchases": "Apple verarbeitet den optionalen einmaligen Kauf zur Werbeentfernung. RevenueCat verarbeitet eine anonyme App-Nutzerkennung und den Kaufverlauf, um werbefreien Zugriff zu prüfen und wiederherzustellen. Wir erhalten keine Zahlungskartendaten. Diese Daten werden auch für Kauf- und Umsatzanalysen verwendet.", "retentionTitle": "Speicherung und Löschung", "retention": "Der Spielfortschritt bleibt auf deinem Gerät, bis du die App samt Daten löschst. Apple und RevenueCat speichern Kaufdaten zur Prüfung, Wiederherstellung und gemäß ihren Aufbewahrungspflichten. Ihre Datenschutzerklärungen erläutern Speicherung und Löschung. Nutze unsere Supportseite für Datenanfragen; veröffentliche keine Belege oder persönlichen Angaben."}, "fr": {"tagline": "Politique de confidentialité", "title": "Politique de confidentialité", "updated": "Dernière mise à jour : 19 septembre 2026", "local": "Soap World ne requiert aucun compte. La progression, les réglages, les scores, la collection et la langue sont stockés localement sur votre appareil et ne sont pas envoyés à notre serveur.", "adsTitle": "Publicité et Google AdMob", "ads": "L'app utilise Google AdMob. Google et ses partenaires peuvent traiter la localisation approximative issue de l'adresse IP, les identifiants de l'appareil, les données publicitaires, les interactions, les diagnostics et les performances afin de diffuser, mesurer, sécuriser et améliorer la publicité.", "choicesTitle": "Vos choix", "choices": "Lorsque requis, des choix de consentement sont présentés avant la demande de publicité. Vous pouvez les revoir dans Réglages → Options de confidentialité. L'autorisation de suivi iOS peut aussi être gérée dans les réglages système.", "childrenTitle": "Comptes et contenu", "children": "L’app ne comporte ni compte de connexion, ni messagerie entre utilisateurs, ni contenu créé par les utilisateurs.", "contactTitle": "Contact", "contact": "Pour toute demande de confidentialité ou d'assistance, utilisez le lien GitHub Issues de notre page d'assistance.", "support": "Assistance", "google": "Confidentialité Google", "purchasesTitle": "Achats et RevenueCat", "purchases": "Apple traite l’achat unique facultatif qui supprime les publicités. RevenueCat traite un identifiant anonyme et l’historique des achats pour vérifier et restaurer cet accès. Nous ne recevons pas les données de votre carte bancaire. Ces données servent également à analyser les achats et les revenus.", "retentionTitle": "Conservation et suppression", "retention": "La progression reste sur votre appareil jusqu’à la suppression de l’app et de ses données. Apple et RevenueCat conservent les achats pour leur vérification, leur restauration et leurs obligations de conservation. Consultez leurs politiques de confidentialité. Utilisez notre page d’assistance pour vos demandes ; ne publiez ni reçus ni données personnelles."}, "es": {"tagline": "Política de privacidad", "title": "Política de privacidad", "updated": "Última actualización: 19 de septiembre de 2026", "local": "Soap World no requiere cuenta. El progreso, los ajustes, las puntuaciones, la colección y el idioma se guardan localmente en tu dispositivo y no se envían a nuestro servidor.", "adsTitle": "Publicidad y Google AdMob", "ads": "La app usa Google AdMob. Google y sus socios pueden procesar ubicación aproximada derivada de la IP, identificadores del dispositivo, datos publicitarios, interacciones, diagnósticos y rendimiento para mostrar, medir, proteger y mejorar la publicidad.", "choicesTitle": "Tus opciones", "choices": "Cuando sea necesario, se muestran opciones de consentimiento antes de solicitar anuncios. Puedes revisarlas en Ajustes → Opciones de privacidad. El permiso de seguimiento de iOS también se gestiona en Ajustes del sistema.", "childrenTitle": "Cuentas y contenido", "children": "La app no tiene cuentas de inicio de sesión, mensajes entre usuarios ni contenido generado por usuarios.", "contactTitle": "Contacto", "contact": "Para solicitudes de privacidad o soporte, utiliza el enlace de GitHub Issues de nuestra página de soporte.", "support": "Soporte", "google": "Privacidad de Google", "purchasesTitle": "Compras y RevenueCat", "purchases": "Apple procesa la compra única opcional para eliminar anuncios. RevenueCat procesa un identificador anónimo y el historial de compras para verificar y restaurar el acceso sin anuncios. No recibimos los datos de tu tarjeta. Estos registros también se utilizan para analizar compras e ingresos.", "retentionTitle": "Conservación y eliminación", "retention": "El progreso permanece en el dispositivo hasta que elimines la app y sus datos. Apple y RevenueCat conservan registros de compras para verificarlos, restaurarlos y cumplir sus requisitos de conservación. Consulta sus políticas de privacidad. Usa nuestra página de soporte para solicitar datos; no publiques recibos ni información personal."}, "it": {"tagline": "Informativa sulla privacy", "title": "Informativa sulla privacy", "updated": "Ultimo aggiornamento: 19 settembre 2026", "local": "Soap World non richiede un account. Progressi, impostazioni, punteggi, raccolta e lingua sono archiviati localmente sul dispositivo e non vengono inviati al nostro server.", "adsTitle": "Pubblicità e Google AdMob", "ads": "L'app usa Google AdMob. Google e i partner pubblicitari possono elaborare posizione approssimativa derivata dall'IP, identificatori del dispositivo, dati pubblicitari, interazioni, diagnostica e prestazioni per fornire, misurare, proteggere e migliorare la pubblicità.", "choicesTitle": "Le tue scelte", "choices": "Dove richiesto, le scelte di consenso vengono mostrate prima di richiedere annunci. Puoi rivederle in Impostazioni → Opzioni privacy. Il permesso di tracciamento iOS è gestibile anche nelle Impostazioni di sistema.", "childrenTitle": "Account e contenuti", "children": "L’app non ha account di accesso, messaggi tra utenti o contenuti generati dagli utenti.", "contactTitle": "Contatti", "contact": "Per richieste sulla privacy o di assistenza, usa il link GitHub Issues nella pagina di supporto.", "support": "Supporto", "google": "Privacy di Google", "purchasesTitle": "Acquisti e RevenueCat", "purchases": "Apple elabora l’acquisto unico facoltativo per rimuovere gli annunci. RevenueCat elabora un identificativo anonimo e la cronologia degli acquisti per verificare e ripristinare l’accesso senza pubblicità. Non riceviamo i dati della carta di pagamento. Questi dati vengono utilizzati anche per analizzare acquisti e ricavi.", "retentionTitle": "Conservazione ed eliminazione", "retention": "I progressi restano sul dispositivo fino alla rimozione dell’app e dei suoi dati. Apple e RevenueCat conservano gli acquisti per verifica, ripristino e obblighi di conservazione. Consulta le loro informative sulla privacy. Usa la pagina di supporto per le richieste sui dati; non pubblicare ricevute o dati personali."}, "pt": {"tagline": "Política de Privacidade", "title": "Política de Privacidade", "updated": "Última atualização: 19 de setembro de 2026", "local": "O Soap World não requer conta. Progresso, definições, pontuações, coleção e idioma são guardados localmente no dispositivo e não são enviados ao nosso servidor.", "adsTitle": "Publicidade e Google AdMob", "ads": "A app usa Google AdMob. A Google e parceiros podem processar localização aproximada derivada do IP, identificadores, dados publicitários, interações, diagnósticos e desempenho para apresentar, medir, proteger e melhorar publicidade.", "choicesTitle": "As suas escolhas", "choices": "Quando exigido, as opções de consentimento aparecem antes dos anúncios. Pode revê-las em Definições → Opções de privacidade. A permissão de seguimento iOS também é gerida nas Definições do sistema.", "childrenTitle": "Contas e conteúdo", "children": "O aplicativo não tem contas de acesso, mensagens entre usuários ou conteúdo gerado por usuários.", "contactTitle": "Contacto", "contact": "Para pedidos de privacidade ou suporte, use o link GitHub Issues na nossa página de suporte.", "support": "Suporte", "google": "Privacidade da Google", "purchasesTitle": "Compras e RevenueCat", "purchases": "A Apple processa a compra única opcional para remover anúncios. A RevenueCat processa um identificador anônimo e o histórico de compras para verificar e restaurar o acesso sem anúncios. Não recebemos os dados do seu cartão. Esses registros também são usados para analisar compras e receitas.", "retentionTitle": "Armazenamento e exclusão", "retention": "O progresso permanece no dispositivo até você excluir o aplicativo e seus dados. Apple e RevenueCat mantêm registros de compras para verificação, restauração e suas obrigações de retenção. Consulte as políticas de privacidade delas. Use nossa página de suporte para solicitações de dados; não publique recibos ou informações pessoais."}, "ja": {"tagline": "プライバシーポリシー", "title": "プライバシーポリシー", "updated": "最終更新日：2026年9月19日", "local": "Soap Worldはアカウントを必要としません。進行状況、設定、スコア、コレクション、言語はデバイスに保存され、当方のサーバーには送信されません。", "adsTitle": "広告とGoogle AdMob", "ads": "広告表示にGoogle AdMobを使用します。Googleと広告パートナーは、広告の配信・測定・安全性・改善のため、IPアドレスから得られるおおよその位置、デバイスID、広告データ、操作、診断、パフォーマンス情報を処理する場合があります。", "choicesTitle": "選択肢", "choices": "必要な場合、広告リクエスト前に同意画面を表示します。設定 → プライバシーオプションで再確認できます。iOSのトラッキング許可はシステム設定でも管理できます。", "childrenTitle": "アカウントとコンテンツ", "children": "ログインアカウント、ユーザー間のメッセージ、ユーザー作成コンテンツはありません。", "contactTitle": "お問い合わせ", "contact": "プライバシーまたはサポートのお問い合わせは、サポートページのGitHub Issuesをご利用ください。", "support": "サポート", "google": "Googleプライバシーポリシー", "purchasesTitle": "購入とRevenueCat", "purchases": "広告を削除する任意の1回限りの購入はAppleが処理します。RevenueCatは匿名のアプリユーザーIDと購入履歴を処理し、広告なしのアクセスを確認・復元します。当方はカード情報を受け取りません。これらの記録は購入と収益の分析にも使用されます。", "retentionTitle": "保存と削除", "retention": "進行状況はアプリとデータを削除するまで端末内に保存されます。AppleとRevenueCatは確認、復元、適用される保存要件のため購入記録を保持します。保存と削除については各社のプライバシーポリシーをご確認ください。データに関するご相談はサポートページをご利用ください。公開の投稿に領収書や個人情報を載せないでください。"}, "ko": {"tagline": "개인정보 처리방침", "title": "개인정보 처리방침", "updated": "최종 업데이트: 2026년 9월 19일", "local": "Soap World는 계정이 필요하지 않습니다. 진행 상황, 설정, 점수, 컬렉션, 언어 선택은 기기에 로컬로 저장되며 당사 서버로 전송되지 않습니다.", "adsTitle": "광고 및 Google AdMob", "ads": "앱은 Google AdMob을 사용합니다. Google과 광고 파트너는 광고 제공·측정·보안·개선을 위해 IP 기반 대략적 위치, 기기 식별자, 광고 데이터, 제품 상호작용, 진단 및 성능 정보를 처리할 수 있습니다.", "choicesTitle": "선택권", "choices": "필요한 경우 광고 요청 전 동의 선택이 표시됩니다. 설정 → 개인정보 옵션에서 다시 확인할 수 있으며 iOS 추적 권한은 시스템 설정에서도 관리합니다.", "childrenTitle": "계정 및 콘텐츠", "children": "앱에는 로그인 계정, 사용자 간 메시지 또는 사용자 생성 콘텐츠가 없습니다.", "contactTitle": "문의", "contact": "개인정보 또는 지원 요청은 지원 페이지의 GitHub Issues 링크를 이용해 주세요.", "support": "지원", "google": "Google 개인정보 처리방침", "purchasesTitle": "구매 및 RevenueCat", "purchases": "Apple은 광고 제거를 위한 선택적 일회성 결제를 처리합니다. RevenueCat은 익명 앱 사용자 식별자와 구매 기록을 처리하여 광고 없는 이용 권한을 확인하고 복원합니다. 당사는 결제 카드 정보를 받지 않습니다. 이 기록은 구매 및 수익 분석에도 사용됩니다.", "retentionTitle": "보관 및 삭제", "retention": "진행 상황은 앱과 데이터를 삭제할 때까지 기기에 저장됩니다. Apple과 RevenueCat은 확인, 복원 및 관련 보관 요건을 위해 구매 기록을 보관합니다. 보관과 삭제에 관한 내용은 각 회사의 개인정보 처리방침을 확인하세요. 데이터 요청은 지원 페이지를 이용하세요. 공개 게시물에 영수증이나 개인정보를 올리지 마세요."}, "zh": {"tagline": "隐私政策", "title": "隐私政策", "updated": "最后更新：2026年9月19日", "local": "Soap World 无需账户。游戏进度、设置、分数、收藏和语言偏好仅保存在您的设备上，不会发送到我们的服务器。", "adsTitle": "广告与 Google AdMob", "ads": "应用使用 Google AdMob 展示广告。Google 及广告合作伙伴可能处理由 IP 地址推导的大致位置、设备标识符、广告数据、产品互动、诊断和性能信息，用于提供、衡量、保护和改进广告。", "choicesTitle": "您的选择", "choices": "在需要的地区，请求广告前会显示同意选项。可在设置 → 隐私选项中重新查看。iOS 跟踪权限也可在系统设置中管理。", "childrenTitle": "账户和内容", "children": "应用没有登录账户、用户间消息或用户生成内容。", "contactTitle": "联系方式", "contact": "如有隐私或支持请求，请使用支持页面上的 GitHub Issues 链接。", "support": "支持", "google": "Google 隐私政策", "purchasesTitle": "购买与RevenueCat", "purchases": "Apple处理可选的一次性移除广告付款。RevenueCat处理匿名应用用户标识符和购买记录，以验证和恢复无广告访问权限。我们不会收到您的支付卡信息。这些记录也用于购买和收入分析。", "retentionTitle": "保存与删除", "retention": "游戏进度保存在设备上，直到您删除应用及其数据。Apple和RevenueCat为验证、恢复购买及适用的保留要求保存购买记录。有关保存和删除的说明，请查阅各自的隐私政策。数据请求请通过支持页面联系；不要在公开问题中发布收据或个人信息。"}};</script><script src="app.js"></script></body></html>
